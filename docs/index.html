<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>FY27 Quantitative Core Goals Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:ital,wght@0,400;0,500;0,600;0,700;0,900;1,400&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css" />
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
</head>
<body>
  <div class="brand-bar"></div>
  <header>
    <div class="brand-mark">
      <img src="assets/logo.png" alt="Premier" class="brand-logo"
           onerror="this.style.display='none'; this.nextElementSibling.style.display='inline';" />
      <span class="brand-word" style="display:none">PREMIER</span>
      <span class="brand-word-accent">Goals Dashboard</span>
    </div>
    <h1>FY27 Quantitative Core Goals Trajectory &amp; Forecast Dashboard</h1>
    <p class="subtitle">Click any chart to view it full-size. Data refreshes each time <code>goals.csv</code> is updated and the export script is rerun.</p>
    <p id="status-line" class="status-line"></p>
  </header>

  <main id="grid" class="grid"></main>

  <div id="modal" class="modal" hidden>
    <div class="modal-content">
      <button id="modal-close" class="modal-close" aria-label="Close">&times;</button>
      <h2 id="modal-title"></h2>
      <p id="modal-subtitle" class="modal-subtitle"></p>
      <div class="modal-canvas-wrap">
        <canvas id="modal-canvas"></canvas>
      </div>
      <p id="modal-pace" class="modal-pace"></p>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
